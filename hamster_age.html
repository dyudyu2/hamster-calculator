<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사람 나이 ➔ 햄스터 나이 계산기</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff9e6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 320px;
      text-align: center;
    }
    h2 {
      color: #d97706;
      margin-top: 0;
    }
    p {
      color: #666;
      font-size: 0.9rem;
    }
    input {
      width: 80%;
      padding: 10px;
      margin: 15px 0;
      border: 2px solid #fcd34d;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }
    input:focus {
      border-color: #f59e0b;
    }
    button {
      background-color: #f59e0b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #d97706;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background-color: #fef3c7;
      border-radius: 8px;
      color: #92400e;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🐹 햄스터 나이 변환기</h2>
    <p>사람 나이(세)를 입력하면<br>햄스터 기준 나이로 계산해 드립니다.</p>
    
    <input type="number" id="humanAge" placeholder="사람 나이 입력 (예: 25)" min="0" max="120">
    <br>
    <button onclick="calculateAge()">계산하기</button>

    <div class="result" id="resultBox"></div>
  </div>

  <script>
    function calculateAge() {
      const humanAge = parseFloat(document.getElementById('humanAge').value);
      const resultBox = document.getElementById('resultBox');

      if (isNaN(humanAge) || humanAge < 0) {
        resultBox.style.display = 'block';
        resultBox.innerHTML = '올바른 나이를 입력해 주세요.';
        return;
      }

      // 수명 기준: 사람 80년 = 햄스터 2년 (24개월)
      // 햄스터 개월 수 = 사람 나이 * (24 / 80)
      const hamsterMonthsTotal = humanAge * (24 / 80);
      
      const years = Math.floor(hamsterMonthsTotal / 12);
      const months = Math.floor(hamsterMonthsTotal % 12);
      const days = Math.round((hamsterMonthsTotal - Math.floor(hamsterMonthsTotal)) * 30);

      let resultText = `사람 <b>${humanAge}세</b>는<br>햄스터 기준으로<br><br> `;
      
      if (years > 0) {
        resultText += `<span style="font-size: 1.2rem; color: #b45309;">${years}살 ${months}개월</span>`;
      } else if (months > 0) {
        resultText += `<span style="font-size: 1.2rem; color: #b45309;">${months}개월 ${days}일</span>`;
      } else {
        resultText += `<span style="font-size: 1.2rem; color: #b45309;">약 ${days}일</span>`;
      }
      
      resultText += ` 입니다! 🌻`;

      resultBox.style.display = 'block';
      resultBox.innerHTML = resultText;
    }
  </script>

</body>
</html>
